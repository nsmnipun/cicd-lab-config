apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-ui
spec:
  replicas: 2
  selector:
    matchLabels: { app: notes-ui }
  template:
    metadata:
      labels: { app: notes-ui }
    spec:
      containers:
        - name: ui
          image: notes-ui
          ports: [{ containerPort: 8080 }]
          env:
            - { name: API_UPSTREAM, value: "http://notes-api:8080" }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: notes-ui
spec:
  selector: { app: notes-ui }
  ports: [{ port: 8080 }]