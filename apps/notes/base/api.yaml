apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-api
spec:
  replicas: 2
  selector:
    matchLabels: { app: notes-api }
  template:
    metadata:
      labels: { app: notes-api }
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:17-alpine
          command: ["sh", "-c", "until pg_isready -h notes-db -p 5432; do sleep 2; done"]
        - name: migrate
          image: notes-api
          args: ["migrate"]
          env:
            - name: ConnectionStrings__Notes
              valueFrom: { secretKeyRef: { name: notes-db, key: connection-string } }
      containers:
        - name: api
          image: notes-api
          ports: [{ containerPort: 8080 }]
          env:
            - name: ConnectionStrings__Notes
              valueFrom: { secretKeyRef: { name: notes-db, key: connection-string } }
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: notes-api
spec:
  selector: { app: notes-api }
  ports: [{ port: 8080 }]